<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14080c"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.jpg"><link rel="apple-touch-icon" href="logo.jpg"><title>San Valentín</title>
<style>
:root{--bg:#14080c;--sf:#1f0f15;--sf2:#2b1720;--ln:#3b212b;--tx:#f5ece9;--mu:#aa9097;--cr:#d1304a;--gd:#d9ae8e;--sh:0 18px 40px #0008;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f6f2f1;--sf:#fff;--sf2:#efe8e7;--ln:#e3d7d5;--tx:#26121a;--mu:#7b666e;--cr:#b8203a;--gd:#a8723f;--sh:0 14px 30px #3a1a2418;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15.5px/1.5 var(--sans);max-width:520px;min-height:100vh;-webkit-font-smoothing:antialiased}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}
#top img{width:34px;height:34px;border-radius:50%;object-fit:cover}#top span{font:600 25px/1 var(--serif)}
body.out #top{display:none}body.out main{padding-top:calc(28px + env(safe-area-inset-top,0px))}
main{padding:6px 16px calc(112px + env(safe-area-inset-bottom,0px))}
h1{font:600 32px/1.1 var(--serif);margin:10px 2px 14px}h2{font:600 24px/1.15 var(--serif);margin:18px 2px 10px}
a{color:var(--gd)}.mu{color:var(--mu);font-size:14px}label{font-size:13px;font-weight:500;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;margin-bottom:14px}.pad{padding:16px}
.row{display:flex;gap:12px;align-items:center}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:26px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.cw{position:relative}.ph{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--sf2)}
.ov{position:absolute;left:0;right:0;bottom:0;padding:96px 20px 18px;background:linear-gradient(to top,#0b0407e6,#0b040700);color:#fff;pointer-events:none}
.nm{font:600 40px/1 var(--serif);display:flex;align-items:center;gap:10px}.nm i{font-style:normal;font-weight:500;opacity:.92}
.loc{margin-top:6px;font-size:14px;opacity:.92}.vb{width:22px;height:22px;color:var(--gd);flex:none}
.cnt{position:absolute;top:14px;right:14px;background:#0007;backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.pcb{padding:18px 20px 6px}.intent{display:inline-block;font-weight:600;font-size:13px;color:var(--gd);border:1px solid var(--gd);border-radius:999px;padding:3px 12px}
.tags{margin:14px 0 4px}.tag{display:inline-block;background:var(--sf2);border-radius:999px;padding:5px 12px;font-size:13px;margin:0 6px 7px 0}
blockquote{margin:16px 0;padding:2px 0 2px 16px;border-left:2px solid var(--gd);font:italic 500 22px/1.3 var(--serif)}
.acts{display:flex;justify-content:center;align-items:center;gap:26px;padding:10px 0 8px}
.fab{width:66px;height:66px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--sf2);color:var(--mu);border:1px solid var(--ln);box-shadow:var(--sh)}
.fab svg{width:28px;height:28px}.fab.like{background:var(--cr);color:#fff;border-color:var(--cr);width:78px;height:78px}
.safe{text-align:center;font-size:13px;margin:2px 0 16px}.safe a{color:var(--mu);margin:0 10px}
button{font:600 15px var(--sans);border:0;border-radius:999px;padding:13px 20px;background:var(--cr);color:#fff;cursor:pointer;transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}button.s{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
input,select{font:inherit;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);margin:5px 0 12px}
input[type=file]{padding:10px}details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.chk{display:inline-flex;align-items:center;margin:0 6px 8px 0;padding:6px 13px;border:1px solid var(--ln);border-radius:999px;font-size:14px;color:var(--tx);background:var(--sf2);cursor:pointer}
.chk input{display:none}.chk:has(input:checked){background:var(--cr);border-color:var(--cr);color:#fff}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(496px,calc(100% - 24px));display:flex;padding:6px;background:color-mix(in srgb,var(--sf) 84%,transparent);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:28px;box-shadow:var(--sh);z-index:6}
nav button{flex:1;position:relative;background:none;color:var(--mu);border-radius:22px;padding:9px 2px 7px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--tx);background:var(--sf2)}nav button.on svg{color:var(--cr)}
nav .bd{position:absolute;top:3px;left:54%;background:var(--cr);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:52vh;overflow-y:auto;padding:4px}
.m{padding:10px 14px;border-radius:20px 20px 20px 6px;max-width:80%;background:var(--sf2);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--cr);color:#fff;border-radius:20px 20px 6px 20px}
.m.pl{border:1.5px dashed var(--gd);background:var(--sf);color:var(--tx);border-radius:14px;font:500 19px/1.3 var(--serif)}
.bar{display:flex;gap:8px;align-items:center}.bar input{margin:0}.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--sf2);flex:none}
.hero{text-align:center;padding:0 4px 22px}.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--gd),var(--sh)}
.hero h1{font-size:48px;margin:18px 0 8px}.hero p{font:italic 500 22px/1.3 var(--serif);color:var(--mu);margin:0 auto;max-width:320px}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#0a0306dd;backdrop-filter:blur(10px);animation:fd .3s ease}
.mbox{width:min(380px,100%);text-align:center;color:#fff}.mbox h2{font-size:48px;margin:20px 0 6px}.mbox p{opacity:.85;margin:0 0 14px}.mbox button{width:100%;margin-top:10px}
.pair{display:flex;justify-content:center}.pair img{width:128px;height:160px;object-fit:cover;border-radius:22px;border:3px solid #14080c}
.pair img:first-child{transform:rotate(-6deg);margin-right:-18px}.pair img:last-child{transform:rotate(6deg);animation:pop .5s .15s both}
@keyframes fd{from{opacity:0}}@keyframes pop{from{transform:rotate(6deg) scale(.6);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header id="top"><img src="logo.jpg" alt=""><span>San Valentín</span></header><main id="app">Cargando…</main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const MAX=5, PLANES=["☕ Café","🌳 Parque","🎶 Evento local","🍽️ Cena"];
const clean=s=>s.replace(/[^\x21-\x7e]/g,"");const sb=supabase.createClient(clean(SUPABASE_URL).replace(/^(https?:\/\/[^\/]+).*$/,"$1"),clean(SUPABASE_KEY));
const $=s=>document.querySelector(s),A=()=>$("#app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=null,tab="d",ch=null,sub=null,gsub=null,unread={};
const tot=()=>Object.values(unread).reduce((a,b)=>a+b,0);
const LR=()=>{try{return JSON.parse(localStorage.getItem("lr")||"{}")}catch(e){return{}}};
const setLR=(mid,id)=>{try{const o=LR();o[mid]=Math.max(o[mid]||0,id);localStorage.setItem("lr",JSON.stringify(o))}catch(e){}};
async function loadUnread(){const {data:ms}=await sb.from("matches").select("id").eq("status","active"),lr=LR();unread={};
 for(const m of ms||[]){const {count}=await sb.from("messages").select("id",{count:"exact",head:true}).eq("match_id",m.id).neq("sender_id",me.id).gt("id",lr[m.id]||0);if(count)unread[m.id]=count}
 nav();if(tab=="c"&&!ch)chats()}
function listen(){if(gsub)return;gsub=sb.channel("inbox").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},e=>{const m=e.new;if(m.sender_id==me.id)return;
 if(ch&&ch.mid==m.match_id){setLR(m.match_id,m.id);return}
 unread[m.match_id]=(unread[m.match_id]||0)+1;nav();if(tab=="c"&&!ch)chats();
 try{navigator.vibrate?.(200)}catch(e){}document.title="💬 Mensaje nuevo – San Valentín"}).subscribe()}
const err=e=>alert(e?.message||e);

async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView();
 const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
 if(!data)return setupView(session.user.id);
 me=data;go("d");listen();loadUnread();try{if(localStorage.getItem("loc"))locOn(1)}catch(e){}}
sb.auth.onAuthStateChange((ev)=>{if(ev=="SIGNED_OUT"){if(gsub){sb.removeChannel(gsub);gsub=null}unread={};init()}});

function authView(){document.body.classList.add("out");$("#nav").innerHTML="";A().innerHTML=`<div class=hero><img src="logo.jpg" alt=""><h1>San Valentín</h1><p>Conoce a alguien de tu ciudad. Gratis, sin pagar por ver likes ni por chatear.</p></div><div class="card pad">
<label>Correo</label><input id=em type=email><label>Contraseña (mín. 6)</label><input id=pw type=password>
<label style="font-size:13px;display:block;margin-bottom:10px"><input type=checkbox id=ok style="width:auto;margin:0 6px 0 0">Tengo 18 años o más y acepto los <a href="terminos.html" target=_blank>Términos</a> y la <a href="privacidad.html" target=_blank>Privacidad</a></label><div class=row><button onclick="auth(0)" style="flex:1">Entrar</button><button class=s onclick="auth(1)" style="flex:1">Crear cuenta</button></div></div>`}
async function auth(reg){if(reg&&!$("#ok").checked)return alert("Para crear tu cuenta debes tener 18 años o más y aceptar los términos.");const email=$("#em").value.trim(),password=$("#pw").value;
 const r=reg?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return err(r.error);
 if(reg&&!r.data.session)return alert("Revisa tu correo para confirmar la cuenta y luego entra.");init()}

function setupView(uid){document.body.classList.add("out");A().innerHTML=`<h1>Crea tu perfil</h1><div class="card pad">
<label>Nombre</label><input id=n><label>Edad (18+)</label><input id=a type=number min=18 max=99>
<label>Ciudad</label><input id=c><label>Qué buscas</label><select id=i><option>Algo serio</option><option>Conocer gente</option><option>Casual</option></select>
<label>Mi plan ideal</label><input id=q1 maxlength=80><label>Algo que me hace reír</label><input id=q2 maxlength=80><label>Busco a alguien que…</label><input id=q3 maxlength=80>
${extraFields()}<label>Foto</label><input id=f type=file accept="image/*"><button id=sv onclick="saveProf('${uid}')" style="width:100%">Guardar</button></div>`}
function shrink(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no("Foto inválida"),"image/jpeg",.6)};im.onerror=()=>no("Foto inválida");im.src=URL.createObjectURL(file)})}
async function saveProf(uid){const g=x=>$("#"+x).value.trim(),f=$("#f").files[0];
 if(!g("n")||!g("c")||g("a")<18)return alert("Completa nombre, ciudad y edad (18+).");
 if(!f)return alert("Sube una foto.");const ex=readExtra();if(!ex)return;$("#sv").disabled=true;
 try{const b=await shrink(f);let photo_url;
  if(WORKER_URL.startsWith("http")){const {data:{session}}=await sb.auth.getSession();
   const u=await fetch(WORKER_URL+"/upload",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"image/jpeg"},body:b});
   if(!u.ok)throw new Error("No se pudo subir la foto: "+await u.text());photo_url=(await u.json()).url}
  else{const path=`${uid}/${Date.now()}.jpg`,u=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});
   if(u.error)throw u.error;photo_url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl}
  const r=await sb.from("profiles").insert({id:uid,name:g("n"),age:+g("a"),city:normCity(g("c")),intent:g("i"),q1:g("q1"),q2:g("q2"),q3:g("q3"),photo_url,...ex});
  if(r.error)throw r.error;init()}catch(e){err(e);$("#sv").disabled=false}}

const SV=d=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const HP='<path d="M12 21s-7.5-4.6-9.6-9.4A5.6 5.6 0 0 1 12 6.1a5.6 5.6 0 0 1 9.6 5.5C19.5 16.4 12 21 12 21z"/>';
const IC={d:SV('<circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/>'),l:SV(HP),c:SV('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>'),v:SV('<path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'),p:SV('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')};
function nav(){$("#nav").innerHTML=[["d","Descubrir"],["l","Likes"],["c","Chats"],["v","Planes"],["p","Perfil"]].map(([k,l])=>`<button class="${tab==k&&!ch?"on":""}" onclick="go('${k}')" aria-label="${l}">${IC[k]}<span>${l}</span>${k=="c"&&tot()?`<span class=bd>${tot()}</span>`:""}</button>`).join("")}
function go(t){document.title="San Valentín";document.body.classList.remove("out");tab=t;ch=null;if(sub){sb.removeChannel(sub);sub=null}nav();({d:disc,l:likes,c:chats,v:places,p:prof})[t]()}
const VB='<svg class=vb viewBox="0 0 24 24" aria-label="Verificado"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="#2a1209" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',IH='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.4A5.6 5.6 0 0 1 12 6.1a5.6 5.6 0 0 1 9.6 5.5C19.5 16.4 12 21 12 21z"/></svg>';
const acts=(id,more)=>`<div class=acts><button class=fab onclick="swipe('${id}',false)" aria-label="Pasar">${IX}</button><button class="fab like" onclick="swipe('${id}',true)" aria-label="Me interesa">${IH}</button></div>${more||""}`;
const card=(p,x="")=>`<div class=pc>${car(p,`<div class=ov><div class=nm>${esc(p.name)}<i>${p.age}</i>${p.verified?VB:""}</div><div class=loc>${esc(p.city)}${p.km_band?` · ${esc(p.km_band)}`:""}</div></div>`)}<div class=pcb><span class=intent>${esc(p.intent)}</span><div class=tags>${extraTags(p)}</div>${[p.q1,p.q2,p.q3].filter(Boolean).map(q=>`<blockquote>${esc(q)}</blockquote>`).join("")}</div>${x}</div>`;
async function matchModal(id){const {data:p}=await sb.from("profiles").select("name,photo_url").eq("id",id).maybeSingle();const o=document.createElement("div");o.className="modal";
 o.innerHTML=`<div class=mbox><div class=pair><img src="${esc(me.photo_url)}" alt=""><img src="${esc(p?.photo_url)}" alt=""></div><h2>Es un match</h2><p>Tú y ${esc(p?.name||"esta persona")} se gustaron. Rompe el hielo con un plan.</p><button onclick="this.closest('.modal').remove();go('c')">Escribir ahora</button><button class=s onclick="this.closest('.modal').remove()">Seguir descubriendo</button></div>`;document.body.append(o)}
const myIds=async()=>{const {data}=await sb.from("swipes").select("to_id").eq("from_id",me.id);return (data||[]).map(r=>r.to_id)};

async function disc(){A().innerHTML="<h1>Descubrir</h1>Cargando…";
 const {data,error}=await sb.rpc("next_profile",{max_km:F.km?+F.km:null,amin:F.amin,amax:F.amax,want:F.want||null});
 if(error)return err(error);const p=data[0];
 A().innerHTML="<h1>Descubrir</h1>"+filtersUI()+(p?card(p,acts(p.id,`<p class=safe><a href="#" onclick="report('${p.id}');return false">Reportar</a><a href="#" onclick="blockUser('${p.id}');return false">Bloquear</a></p>`)):`<div class="card pad">Ya viste a todos por ahora. Amplía la distancia en los filtros o vuelve más tarde.</div>`)}
async function swipe(id,liked){const r=await sb.from("swipes").insert({from_id:me.id,to_id:id,liked});if(r.error)return err(r.error);
 if(liked){const {data}=await sb.from("matches").select("id").or(`and(a.eq.${me.id},b.eq.${id}),and(a.eq.${id},b.eq.${me.id})`);if(data?.length)matchModal(id)}
 tab=="l"?likes():disc()}
async function report(id){const reason=prompt("¿Qué pasó? (ej: perfil falso, acoso, spam)");if(!reason)return;
 const r=await sb.from("reports").insert({reporter:me.id,reported:id,reason});r.error?err(r.error):alert("Gracias, lo revisaremos.")}

async function likes(){A().innerHTML="<h1>Les gustas</h1>Cargando…";
 const {data:l}=await sb.from("swipes").select("from_id").eq("to_id",me.id).eq("liked",true);const mine=await myIds();
 const ids=(l||[]).map(r=>r.from_id).filter(x=>!mine.includes(x));
 let ps=[];if(ids.length){const r=await sb.from("profiles").select("*").in("id",ids);ps=r.data||[]}
 A().innerHTML="<h1>Les gustas</h1><p class=mu>Gratis y sin desenfoque.</p>"+(ps.length?ps.map(p=>card(p,acts(p.id))).join(""):`<div class="card pad">Aún no hay likes nuevos.</div>`)}

async function chats(){A().innerHTML="<h1>Chats</h1>Cargando…";
 const {data:ms}=await sb.from("matches").select("*").eq("status","active").order("created_at",{ascending:false});
 const oth=(ms||[]).map(m=>m.a==me.id?m.b:m.a);let ps={};
 if(oth.length){const r=await sb.from("profiles").select("id,name,photo_url").in("id",oth);(r.data||[]).forEach(p=>ps[p.id]=p)}
 A().innerHTML=`<h1>Chats <span class=mu>${(ms||[]).length}/${MAX}</span></h1>`+((ms||[]).length?ms.map(m=>{const p=ps[m.a==me.id?m.b:m.a]||{};return `<div class="card pad row" onclick="openChat(${m.id},'${p.id}')"><img class=av src="${esc(p.photo_url)}" alt=""><b>${esc(p.name)}</b>${unread[m.id]?` <span style="background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;font-size:12px">${unread[m.id]} nuevo${unread[m.id]>1?"s":""}</span>`:""}</div>`}).join(""):`<div class="card pad">Aún no tienes matches.</div>`)+`<p class=mu>Máximo ${MAX} chats a la vez para que cada conversación importe.</p>`}
async function openChat(mid,pid){ch={mid,pid};nav();const {data:p}=await sb.from("profiles").select("name").eq("id",pid).single();
 A().innerHTML=`<button class=s onclick="go('c')">← Volver</button><h1>${esc(p?.name)}</h1><div class=msgs id=ms></div><div class=bar><input id=t placeholder="Escribe un mensaje…" maxlength=1000><button onclick="send()">Enviar</button></div>
 <p style="margin-top:14px"><button onclick="planPicker()">📍 Proponer un plan</button></p>
 <p style="margin-top:16px"><button class=s onclick="closeChat()">Cerrar este chat</button> <button class=s onclick="report('${pid}')">Reportar</button> <button class=s onclick="blockUser('${pid}')">Bloquear</button></p>`;
 const {data:msgs}=await sb.from("messages").select("*").eq("match_id",mid).order("created_at");(msgs||[]).forEach(add);if(msgs?.length)setLR(mid,msgs[msgs.length-1].id);delete unread[mid];nav();
 sub=sb.channel("m"+mid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`match_id=eq.${mid}`},e=>{if(e.new.sender_id!=me.id){add(e.new);setLR(mid,e.new.id)}}).subscribe()}
function add(m){const e=$("#ms");if(!e)return;const d=document.createElement("div");d.className="m "+(m.sender_id==me.id?"me ":"")+(m.kind=="plan"?"pl":"");d.textContent=(m.kind=="plan"?(m.sender_id==me.id?"Te propongo: ":"Te propone: "):"")+m.body;e.append(d);e.scrollTop=e.scrollHeight}
async function send(body,kind="text"){const i=$("#t");body=body||i.value.trim();if(!body)return;
 const r=await sb.from("messages").insert({match_id:ch.mid,sender_id:me.id,body,kind}).select().single();if(r.error)return err(r.error);add(r.data);if(i)i.value=""}
async function closeChat(){if(!confirm("¿Cerrar este chat? Liberas un lugar."))return;await sb.from("matches").update({status:"closed"}).eq("id",ch.mid);go("c")}

async function planPicker(){if($("#pk"))return;
 const {data:v}=await sb.from("venues").select("*").eq("city",me.city).eq("active",true).order("partner",{ascending:false}).limit(15);
 const o=document.createElement("div");o.className="card pad";o.id="pk";
 o.innerHTML="<b>Elige un plan</b>"+(v||[]).map(x=>`<p><button class=s style="width:100%;text-align:left" onclick="sendPlan(${x.id})">${esc(x.name)}${x.partner?" ⭐":""}<br><small>${esc(x.offer||x.category||"")}</small></button></p>`).join("")+`<p class=mu>O algo simple:</p>`+PLANES.map(x=>`<button class=s style="margin:3px" onclick="sendPlan(0,'${x}')">${x}</button>`).join("");
 $("#ms").after(o)}
async function sendPlan(vid,txt){$("#pk")?.remove();let body=txt;
 if(vid){const {data:v}=await sb.from("venues").select("name,offer").eq("id",vid).single();body=v.name+(v.offer?" — "+v.offer:"")}
 const r=await sb.from("messages").insert({match_id:ch.mid,sender_id:me.id,body,kind:"plan",venue_id:vid||null}).select().single();
 if(r.error)return err(r.error);add(r.data)}
async function places(){A().innerHTML="<h1>Planes en tu ciudad</h1>Cargando…";
 const [e,v,a]=await Promise.all([
  sb.from("events").select("*").eq("city",me.city).eq("active",true).gte("starts_at",new Date().toISOString()).order("starts_at").limit(10),
  sb.from("venues").select("*").eq("city",me.city).eq("active",true).order("partner",{ascending:false}).limit(20),
  sb.from("ads").select("*").eq("city",me.city).eq("active",true).limit(1)]);
 const ad=a.data?.[0],none=t=>`<div class="card pad mu">${t}</div>`;
 A().innerHTML="<h1>Planes en tu ciudad</h1><p class=mu>Ideas para salir. Conectar con gente siempre es gratis.</p>"
 +(ad?`<div class="card pad"><span class=tag>Patrocinado</span><br><b>${esc(ad.title)}</b><p>${esc(ad.body)}</p>${/^https?:/.test(ad.link||"")?`<a href="${esc(ad.link)}" target=_blank rel=noopener>Ver más</a>`:""}</div>`:"")
 +"<h2>Eventos</h2>"+(e.data?.length?e.data.map(x=>`<div class="card pad"><b>${esc(x.title)}</b>${x.sponsor?` <span class=tag>Con ${esc(x.sponsor)}</span>`:""}<p class=mu>${new Date(x.starts_at).toLocaleString("es",{dateStyle:"medium",timeStyle:"short"})}</p><p>${esc(x.description)}</p></div>`).join(""):none("Aún no hay eventos."))
 +"<h2>Lugares</h2>"+(v.data?.length?v.data.map(x=>`<div class="card pad"><b>${esc(x.name)}</b> ${x.partner?"<span class=tag>⭐ Aliado</span>":""}<br><span class=mu>${esc(x.category)} · ${esc(x.address)}</span>${x.offer?`<p>🎁 ${esc(x.offer)}</p>`:""}</div>`).join(""):none("Aún no hay lugares."))}
const INTS=["Playa","Beber","Bailar","Series y TV","Cine","Gym","Viajar","Música","Cocinar","Mascotas","Leer","Deportes","Videojuegos","Naturaleza","Café","Fotografía"];
const OPT={ed:["Bachillerato","Técnico/tecnológico","Universitario en curso","Universitario titulado","Posgrado"],dr:["No bebo","Bebo socialmente","Bebo frecuentemente"],sm:["No fumo","Fumo ocasionalmente","Fumo"],wk:["No hago ejercicio","Ejercicio a veces","Ejercicio frecuente"],ps:["Tímido/a","Ambivertido/a","Extrovertido/a"]};
const sel=(id,lab,v)=>`<label>${lab}</label><select id=${id}><option value="">Prefiero no decir</option>${OPT[id].map(o=>`<option${o==v?" selected":""}>${o}</option>`).join("")}</select>`;
const extraFields=(p={})=>`<label>Estatura en cm (opcional)</label><input id=ht type=number min=120 max=230 value="${p.height_cm||""}">`+sel("ed","Nivel de estudios",p.education)+sel("dr","¿Bebes alcohol?",p.drinks)+sel("sm","¿Fumas?",p.smokes)+sel("wk","Ejercicio",p.workout)+sel("ps","Personalidad",p.personality)+`<label>Me gusta (hasta 6)</label><div style="margin-bottom:10px">${INTS.map(x=>`<label class=chk><input type=checkbox name=int value="${x}"${(p.interests||[]).includes(x)?" checked":""}>${x}</label>`).join("")}</div>`;
function readExtra(){const v=id=>$("#"+id).value||null,h=+$("#ht").value||null;
 if(h&&(h<120||h>230)){alert("La estatura debe estar entre 120 y 230 cm.");return null}
 return {height_cm:h,education:v("ed"),drinks:v("dr"),smokes:v("sm"),workout:v("wk"),personality:v("ps"),interests:[...document.querySelectorAll("input[name=int]:checked")].map(i=>i.value).slice(0,6)}}
const extraTags=p=>[p.height_cm?`📏 ${p.height_cm} cm`:"",p.education?`🎓 ${p.education}`:"",p.drinks?`🍷 ${p.drinks}`:"",p.smokes?`🚬 ${p.smokes}`:"",p.workout?`💪 ${p.workout}`:"",p.personality?`🙂 ${p.personality}`:"",...(p.interests||[])].filter(Boolean).map(t=>`<span class=tag>${esc(t)}</span>`).join("");
let F={amin:18,amax:60,km:"",want:""};try{F={...F,...JSON.parse(localStorage.getItem("f")||"{}")}}catch(e){}
const filtersUI=()=>`<details class="card pad" style="margin-bottom:12px"><summary><b>Filtros</b> <span class=mu>${F.amin}–${F.amax} años · ${F.km?"hasta "+F.km+" km":"toda mi ciudad"}${F.want?" · "+esc(F.want):""}</span></summary><label>Edad mínima</label><input id=fa type=number min=18 max=99 value="${F.amin}"><label>Edad máxima</label><input id=fb type=number min=18 max=99 value="${F.amax}"><label>Distancia (requiere activar cercanía en tu perfil)</label><select id=fk><option value="">Toda mi ciudad</option>${[1,5,10,25].map(k=>`<option value=${k}${F.km==k?" selected":""}>Hasta ${k} km</option>`).join("")}</select><label>Qué busca</label><select id=fw><option value="">Cualquiera</option>${["Algo serio","Conocer gente","Casual"].map(x=>`<option${F.want==x?" selected":""}>${x}</option>`).join("")}</select><button onclick="applyF()" style="width:100%">Aplicar</button></details>`;
function applyF(){F={amin:+$("#fa").value||18,amax:+$("#fb").value||99,km:$("#fk").value,want:$("#fw").value};try{localStorage.setItem("f",JSON.stringify(F))}catch(e){}disc()}
function locOn(silent){if(!navigator.geolocation)return silent||alert("Tu dispositivo no permite ubicación.");
 navigator.geolocation.getCurrentPosition(async pos=>{const r2=x=>Math.round(x*100)/100;
  const r=await sb.from("locations").upsert({user_id:me.id,lat:r2(pos.coords.latitude),lng:r2(pos.coords.longitude),updated_at:new Date().toISOString()});
  if(r.error)return silent||err(r.error);try{localStorage.setItem("loc","1")}catch(e){}
  if(!silent){alert("Listo. Guardamos solo tu ubicación aproximada (~1 km). Nadie ve tu ubicación exacta.");prof()}},
  ()=>silent||alert("No pudimos obtener tu ubicación. Revisa el permiso del navegador."),{maximumAge:600000,timeout:15000})}
async function locOff(){await sb.from("locations").delete().eq("user_id",me.id);try{localStorage.removeItem("loc")}catch(e){}prof()}
const POSES=["tu mano abierta junto a tu cara","un pulgar arriba","dos dedos haciendo la V"];
function verifyView(){const pose=POSES[Math.floor(Math.random()*POSES.length)];
 A().innerHTML=`<button class=s onclick="prof()">← Volver</button><h1>Verificar mi perfil</h1><div class="card pad"><p>Tómate una selfie <b>ahora</b> mostrando <b>${pose}</b>. Solo la ve el equipo de San Valentín, nunca otros usuarios, y sirve para dar la insignia ✅.</p><input id=sf type=file accept="image/*" capture="user"><button onclick="sendSelfie('${pose}')" style="width:100%">Enviar selfie</button></div>`}
async function sendSelfie(pose){const f=$("#sf").files[0];if(!f)return alert("Toma o elige tu selfie.");
 try{const b=await shrink(f),path=`${me.id}/${Date.now()}.jpg`;await sb.from("verifications").delete().eq("user_id",me.id);
  const u=await sb.storage.from("selfies").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
  const r=await sb.from("verifications").insert({user_id:me.id,selfie_path:path,pose});if(r.error)throw r.error;
  alert("Selfie enviada. La revisaremos pronto.");prof()}catch(e){err(e)}}
const extrasMgr=()=>`<div class="card pad"><b>Seguridad y cercanía</b><p>${me.verified?"✅ Perfil verificado":`<span id=vs></span><button class=s onclick="verifyView()">✅ Verificar mi perfil</button>`}</p><p>${localStorage.getItem("loc")?`📍 Cercanía activa · <a href="#" onclick="locOff();return false">Desactivar</a>`:`<button class=s onclick="locOn()">📍 Activar cercanía</button>`}</p><p class=mu>La cercanía es opcional: guardamos solo una ubicación aproximada y los demás ven rangos como "a menos de 5 km", nunca tu ubicación.</p></div>`;
async function blockUser(id){if(!confirm("¿Bloquear a esta persona? Ya no podrán verse ni escribirse."))return;
 const r=await sb.rpc("block_user",{target:id});if(r.error)return err(r.error);alert("Persona bloqueada.");go(ch?"c":tab)}
async function delAccount(){if(prompt("Esto borra para siempre tu cuenta, fotos, matches y mensajes. Escribe BORRAR para confirmar:")!=="BORRAR")return;
 try{const {data:f}=await sb.storage.from("photos").list(me.id);if(f?.length)await sb.storage.from("photos").remove(f.map(x=>me.id+"/"+x.name));
  const r=await sb.rpc("delete_my_account");if(r.error)throw r.error;await sb.auth.signOut();alert("Tu cuenta fue eliminada.")}catch(e){err(e)}}
const normCity=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function editProf(){A().innerHTML=`<h1>Editar perfil</h1><div class="card pad"><label>Nombre</label><input id=n value="${esc(me.name)}"><label>Edad (18+)</label><input id=a type=number min=18 max=99 value="${me.age}"><label>Ciudad (solo el nombre, ej: quito)</label><input id=c value="${esc(me.city)}"><label>Qué buscas</label><select id=i>${["Algo serio","Conocer gente","Casual"].map(x=>`<option${x==me.intent?" selected":""}>${x}</option>`).join("")}</select><label>Mi plan ideal</label><input id=q1 maxlength=80 value="${esc(me.q1)}"><label>Algo que me hace reír</label><input id=q2 maxlength=80 value="${esc(me.q2)}"><label>Busco a alguien que…</label><input id=q3 maxlength=80 value="${esc(me.q3)}">${extraFields(me)}<div class=row><button class=s onclick="prof()" style="flex:1">Cancelar</button><button onclick="saveEdit()" style="flex:1">Guardar</button></div></div>`}
async function saveEdit(){const g=x=>$("#"+x).value.trim();if(!g("n")||!g("c")||g("a")<18)return alert("Completa nombre, ciudad y edad (18+).");
 const ex=readExtra();if(!ex)return;
 const r=await sb.from("profiles").update({name:g("n"),age:+g("a"),city:normCity(g("c")),intent:g("i"),q1:g("q1"),q2:g("q2"),q3:g("q3"),...ex}).eq("id",me.id).select().single();if(r.error)return err(r.error);me=r.data;prof()}
const photosOf=p=>p.photos?.length?p.photos:[p.photo_url];
const car=(p,over="")=>{const ph=photosOf(p);return `<div class=cw><img class=ph src="${esc(ph[0])}" alt="" data-ph="${esc(ph.join("|"))}" data-i=0 onclick="nextPh(this)">${ph.length>1?`<span class=cnt>1/${ph.length}</span>`:""}${over}</div>`};
function nextPh(img){const a=img.dataset.ph.split("|");if(a.length<2)return;const i=(+img.dataset.i+1)%a.length;img.src=a[i];img.dataset.i=i;img.nextSibling.textContent=(i+1)+"/"+a.length}
async function uploadPhoto(f){const b=await shrink(f),path=`${me.id}/${Date.now()}.jpg`,u=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;return sb.storage.from("photos").getPublicUrl(path).data.publicUrl}
async function setPhotos(arr){const r=await sb.from("profiles").update({photos:arr,photo_url:arr[0]}).eq("id",me.id).select().single();if(r.error)return err(r.error);me=r.data;prof()}
async function addPhoto(inp){const f=inp.files[0];if(!f)return;const ph=photosOf(me);if(ph.length>=5)return alert("Máximo 5 fotos.");inp.disabled=true;
 try{await setPhotos([...ph,await uploadPhoto(f)])}catch(e){err(e);inp.disabled=false}}
async function delPhoto(i){const ph=photosOf(me);if(ph.length<2)return alert("Debes tener al menos 1 foto.");if(!confirm("¿Quitar esta foto?"))return;
 const k=ph[i].split("/photos/")[1];if(k)sb.storage.from("photos").remove([decodeURIComponent(k)]);await setPhotos(ph.filter((_,j)=>j!=i))}
function mainPhoto(i){const ph=photosOf(me);setPhotos([ph[i],...ph.filter((_,j)=>j!=i)])}
const photoMgr=()=>{const ph=photosOf(me);return `<div class="card pad"><b>Mis fotos (${ph.length}/5)</b><div class=row style="flex-wrap:wrap;margin:10px 0">${ph.map((u,i)=>`<div style="text-align:center"><img style="width:72px;height:72px;border-radius:12px;object-fit:cover" src="${esc(u)}" alt=""><br><small>${i?`<a href="#" onclick="mainPhoto(${i});return false">⭐</a> `:"★ "}<a href="#" onclick="delPhoto(${i});return false">✖</a></small></div>`).join("")}</div>${ph.length<5?`<input type=file accept="image/*" onchange="addPhoto(this)">`:""}<p class=mu>★ es tu foto principal. Toca ⭐ para usar otra como principal y ✖ para quitarla.</p></div>`};
function prof(){A().innerHTML="<h1>Mi perfil</h1>"+card(me)+photoMgr()+extrasMgr()+(SUPPORT_URL?`<p><a href="${esc(SUPPORT_URL)}" target=_blank rel=noopener>💝 Apoya San Valentín (voluntario)</a></p>`:"")+`<button class=s onclick="editProf()">✏️ Editar datos</button> <button class=s onclick="sb.auth.signOut()">Cerrar sesión</button><p class=mu style="margin-top:18px"><a href="terminos.html" target=_blank>Términos</a> · <a href="privacidad.html" target=_blank>Privacidad</a> · <a href="#" onclick="delAccount();return false">🗑️ Borrar mi cuenta</a></p>`;if(!me.verified)sb.from("verifications").select("status").maybeSingle().then(r=>{const e=$("#vs");if(e&&r.data)e.textContent="⏳ Verificación en revisión · "})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script></body></html>
